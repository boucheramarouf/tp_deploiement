name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tp-deploiement

jobs:
  # ------------------------------------------------------------------
  # Job 1 : Tests unitaires
  # ------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # ------------------------------------------------------------------
  # Job 2 : Tests E2E (Cypress) - ne tourne que si les tests unitaires passent
  # ------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cypress E2E (demarre le serveur + lance Cypress)
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: http://localhost:3000/health
          wait-on-timeout: 60

  # ------------------------------------------------------------------
  # Job 3 : Build & Push sur Docker Hub - seulement si Job 1 ET Job 2 OK
  # ------------------------------------------------------------------
  build-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Job 4 : Deploiement sur la VM Azure via SSH (idempotent)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy on Azure VM
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE="${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image_tag }}"
            echo "Deploiement de $IMAGE"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull "$IMAGE"

            # Idempotent : un seul conteneur nomme "myapp"
            docker rm -f myapp 2>/dev/null || true
            docker run -d \
              --name myapp \
              --restart unless-stopped \
              -p 80:3000 \
              -e PORT=3000 \
              "$IMAGE"

            docker image prune -f

      - name: Healthcheck via IP publique
        run: |
          set -e
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ secrets.AZURE_VM_HOST }}/health" || true)
            echo "Tentative $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Application en ligne."
              exit 0
            fi
            sleep 5
          done
          echo "L'application ne repond pas."
          exit 1
