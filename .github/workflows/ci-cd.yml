name: CI/CD

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tp-deploiement

jobs:
  # ------------------------------------------------------------------
  # Job 1 : Tests unitaires
  # ------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # ------------------------------------------------------------------
  # Job 2 : Tests E2E (Cypress) - ne tourne que si les tests unitaires passent
  # ------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cypress E2E (demarre le serveur + lance Cypress)
        uses: cypress-io/github-action@v6
        with:
          start: npm start
          wait-on: http://localhost:3000/health
          wait-on-timeout: 60

  # ------------------------------------------------------------------
  # Job 3 : Build & Push sur Docker Hub - seulement si Job 1 ET Job 2 OK
  # ------------------------------------------------------------------
  build-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Job 4 : Deploiement sur Azure (idempotent) via Azure Container Instances
  #
  # NB : l'abonnement Azure for Students utilise n'autorise AUCUNE VM
  # (quota vCPU = 0 + capacite indisponible dans les regions autorisees).
  # On deploie donc le conteneur sur Azure Container Instances (ACI) :
  # meme resultat (conteneur unique sur IP publique Azure, redeploiement
  # automatique a chaque push), l'acces SSH est remplace par la CLI Azure.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy on Azure (ACI)
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Login Azure (OIDC, identite manageable)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container (idempotent)
        run: |
          set -e
          RG='${{ secrets.AZURE_RG }}'
          IMAGE='${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image_tag }}'
          LABEL='${{ secrets.AZURE_DNS_LABEL }}'
          # le resource group existe deja (cree lors de la mise en place OIDC) ;
          # l'identite managee a le role Contributor uniquement sur ce groupe.

          DNS_ARGS=""
          [ -n "$LABEL" ] && DNS_ARGS="--dns-name-label $LABEL --dns-name-label-reuse-policy Unsecure"

          # Idempotent : un seul container group nomme "myapp"
          az container delete -g "$RG" -n myapp --yes 2>/dev/null || true
          az container create \
            -g "$RG" -n myapp \
            --image "$IMAGE" \
            --os-type Linux --cpu 1 --memory 1 \
            --ports 3000 \
            --ip-address Public $DNS_ARGS \
            --environment-variables PORT=3000 \
            --restart-policy Always \
            --registry-login-server index.docker.io \
            --registry-username '${{ secrets.DOCKERHUB_USERNAME }}' \
            --registry-password '${{ secrets.DOCKERHUB_TOKEN }}' \
            -o none

          IP=$(az container show -g "$RG" -n myapp --query ipAddress.ip -o tsv)
          FQDN=$(az container show -g "$RG" -n myapp --query ipAddress.fqdn -o tsv)
          echo "APP_IP=$IP"     >> "$GITHUB_ENV"
          echo "APP_FQDN=$FQDN" >> "$GITHUB_ENV"
          echo "### Deploiement Azure" >> "$GITHUB_STEP_SUMMARY"
          echo "- IP publique : http://$IP:3000/"   >> "$GITHUB_STEP_SUMMARY"
          [ -n "$FQDN" ] && echo "- FQDN : http://$FQDN:3000/" >> "$GITHUB_STEP_SUMMARY"
          az container show -g "$RG" -n myapp \
            --query "{ip:ipAddress.ip,fqdn:ipAddress.fqdn,state:instanceView.state}" -o json

      - name: Healthcheck sur l'IP publique Azure
        run: |
          set -e
          echo "Cible : http://${APP_IP}:3000/health"
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -m 5 -w "%{http_code}" "http://${APP_IP}:3000/health" || true)
            echo "Tentative $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Application en ligne : http://${APP_IP}:3000/"
              [ -n "${APP_FQDN}" ] && echo "                       http://${APP_FQDN}:3000/"
              exit 0
            fi
            sleep 8
          done
          echo "::error::L'application ne repond pas apres 24 tentatives"
          echo "----- logs conteneur -----"
          az container logs -g '${{ secrets.AZURE_RG }}' -n myapp || true
          exit 1
