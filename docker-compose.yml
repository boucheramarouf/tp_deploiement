# Utilise sur la VM Azure pour un deploiement idempotent.
# `docker compose up -d` recree le conteneur seulement si l'image a change.
services:
  app:
    image: ${IMAGE:-boucheramarouf/tp-deploiement:latest}
    container_name: myapp
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - PORT=3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
